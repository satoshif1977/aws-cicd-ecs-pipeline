name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cdk-test:
    name: CDK Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

      - name: Run CDK tests
        run: npm test
