name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

jobs:
  flask-test:
    name: Flask アプリ ユニットテスト
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest pytest-cov ruff black

      - name: ruff（構文チェック）
        run: ruff check app/

      - name: black（フォーマットチェック）
        run: black --check app/

      - name: pytest
        run: pytest app/test_app.py -v --tb=short --cov=app --cov-report=xml
      - name: Upload coverage to Codecov (Python)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          fail_ci_if_error: false
