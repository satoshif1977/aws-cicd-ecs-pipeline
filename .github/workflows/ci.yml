name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cdk-test:
    name: CDK Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

      - name: Run CDK tests
        run: npm test -- --coverage
      - name: Upload coverage to Codecov (TypeScript)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: cdk/coverage
          flags: typescript
          fail_ci_if_error: false

  flask-test:
    name: Flask アプリ ユニットテスト
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest pytest-cov ruff black

      - name: ruff（構文チェック）
        run: ruff check app/

      - name: black（フォーマットチェック）
        run: black --check app/

      - name: pytest
        run: pytest app/test_app.py -v --tb=short --cov=app --cov-report=xml
      - name: Upload coverage to Codecov (Python)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          fail_ci_if_error: false
