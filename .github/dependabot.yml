version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/cdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # ts-jest@29 は typescript <7 のみ対応。ts-jest が TS7 対応後に解除
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # cdk-nag v3 は IAspect→IPolicyValidationPlugin へ全面改修が必要。別途移行 Issue で対応
      - dependency-name: "cdk-nag"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/lambda_go/deploy-notifier"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
